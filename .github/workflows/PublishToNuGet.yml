name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
       dotnet-version: | 
          11.0.x

    - name: Build projects
      shell: pwsh
      run: |
        Get-ChildItem ./src -Recurse -Filter *.csproj |
        ForEach-Object {
          dotnet build $_.FullName -c Release
        }

    - name: Pack projects
      shell: pwsh
      run: |
        Get-ChildItem ./src -Recurse -Filter *.csproj |
        ForEach-Object {
          dotnet pack $_.FullName -c Release --no-build -o ./packages
        }

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push "**/packages/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source "https://api.nuget.org/v3/index.json" --skip-duplicate